info:
  name: coordinates
  type: http
  seq: 1

http:
  method: GET
  url: https://nominatim.openstreetmap.org/search?q=Gardner, MA&format=json&limit=1
  headers:
    - name: User-Agent
      value: MWCC-Melanson
  params:
    - name: q
      value: Gardner, MA
      type: query
    - name: format
      value: json
      type: query
    - name: limit
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
